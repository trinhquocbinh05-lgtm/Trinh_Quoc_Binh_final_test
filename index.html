<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Xếp Hình</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-slate-200">
    <div class="py-8 px-4">
        <div class="max-w-7xl mx-auto">
            <div class="text-center mb-8">
                <button id="startBtn" class="px-8 py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-lg shadow-md transition-colors">
                    Bắt đầu
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                <div class="lg:col-span-2 flex justify-center">
                    <div id="gameBoard" class="grid grid-cols-4 gap-3 p-6 bg-white rounded-lg shadow-md">
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="bg-white rounded-lg shadow-md p-6 text-center">
                        <h3 class="text-lg font-semibold mb-2">Đồng Hồ</h3>
                        <div id="timer" class="text-4xl font-bold">00:00</div>
                    </div>

                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h3 class="text-lg font-semibold text-center mb-4">Hướng Dẫn Di Chuyển</h3>
                        <div class="flex flex-col items-center space-y-2">
                            <button id="btnUp" class="w-14 h-14 flex items-center justify-center rounded-lg bg-white border-2 border-gray-300 hover:border-gray-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                                </svg>
                            </button>
                            <div class="flex space-x-2">
                                <button id="btnLeft" class="w-14 h-14 flex items-center justify-center rounded-lg bg-white border-2 border-gray-300 hover:border-gray-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                                    </svg>
                                </button>
                                <div class="w-14 h-14 flex items-center justify-center rounded-lg bg-gray-100 border-2 border-gray-300 font-bold text-lg">W</div>
                                <button id="btnRight" class="w-14 h-14 flex items-center justify-center rounded-lg bg-white border-2 border-gray-300 hover:border-gray-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="flex space-x-2">
                                <div class="w-14 h-14 flex items-center justify-center rounded-lg bg-gray-100 border-2 border-gray-300 font-bold text-lg">A</div>
                                <div class="w-14 h-14 flex items-center justify-center rounded-lg bg-gray-100 border-2 border-gray-300 font-bold text-lg">S</div>
                                <div class="w-14 h-14 flex items-center justify-center rounded-lg bg-gray-100 border-2 border-gray-300 font-bold text-lg">D</div>
                            </div>
                            <button id="btnDown" class="w-14 h-14 flex items-center justify-center rounded-lg bg-white border-2 border-gray-300 hover:border-gray-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="winMessage" class="text-center mb-8 hidden">
                <div class="inline-block bg-green-500 text-white px-8 py-4 rounded-lg shadow-lg">
                    <h2 class="text-3xl font-bold">YOU WIN!</h2>
                    <p id="winText" class="mt-2"></p>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold text-center mb-4">Lịch Sử Lượt Chơi</h2>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b-2 border-gray-300">
                                <th class="py-3 px-4 text-left bg-gray-100 font-semibold">#</th>
                                <th class="py-3 px-4 text-left bg-gray-100 font-semibold">Bước đi</th>
                                <th class="py-3 px-4 text-left bg-gray-100 font-semibold">Thời Gian</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable">
                            <tr>
                                <td colspan="3" class="py-4 text-center text-gray-500">Đang tải...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"> </script>
</body>
</html>
